name: Tests

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-

    - name: Cache target directory
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-target-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-target-test-

    # Pinned to a commit rather than a branch: a newer suite can add files
    # exercising proposals wasmrun does not implement, and that should be a
    # deliberate baseline change rather than a surprise red build. Keep this in
    # step with `spec_suite_rev` in the justfile.
    - name: Fetch the WebAssembly spec test suite
      run: |
        git clone https://github.com/WebAssembly/testsuite.git _tests/testsuite
        git -C _tests/testsuite checkout 65a43d2e9464b6967c98b23c8493765c4d124f4e

    - name: Run tests
      run: cargo test --all-features --verbose
      env:
        SKIP_UI_BUILD: 1
